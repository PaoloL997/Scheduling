{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi — Programmazione Produzione</title>
    <link rel="stylesheet" href="{% static 'ui/style.css' %}">
    <script>
        (function () {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.add('light-pending');
            }
        })();
    </script>
</head>
<body>
<script>
    if (document.documentElement.classList.contains('light-pending')) {
        document.body.classList.add('light');
        document.documentElement.classList.remove('light-pending');
    }
</script>

<div class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-logo-above">
            <img src="{% static 'img/logo.png' %}" alt="B&amp;R Logo" width="72" height="72">
        </div>
        <div class="auth-card">
            <h1 class="auth-title">Bentornato</h1>
            <p class="auth-subtitle">Accedi al tuo account Workflow</p>

            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" class="auth-form" novalidate>
                {% csrf_token %}
                <div class="auth-field">
                    <label for="id_username">Username</label>
                    <input type="text" id="id_username" name="username" autocomplete="username" placeholder="Il tuo username" required autofocus>
                </div>
                <div class="auth-field">
                    <label for="id_password">Password</label>
                    <input type="password" id="id_password" name="password" autocomplete="current-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">Accedi</button>
            </form>

            <p class="auth-link">Non hai un account? <a href="{% url 'register' %}">Registrati</a></p>
        </div>
    </div>
</div>

<button id="theme-toggle" onclick="toggleTheme()" title="Cambia tema" aria-label="Cambia tema">
    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
</button>

<script>
    function toggleTheme() {
        document.body.classList.toggle('light');
        localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
    }
</script>
</body>
</html>
