[project]
name = "programmazione-produzione"
version = "0.1.0"
description = ""
authors = [
    {name = "Paolo Litta",email = "plitta@brembanarolle.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "pywin32 (>=311,<312)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "django (>=5.0,<6.0)",
    "openai (>=2.41.0,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "waitress (>=3.0.2,<4.0.0)",
    "langgraph (>=1.2.2,<2.0.0)",
    "ortools (>=9.15.6755,<10.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "langchain (>=1.3.7,<2.0.0)",
    "langchain-openai (>=1.3.0,<2.0.0)",
    "psycopg[binary] (>=3.2,<4)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.0,<5.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "pytest (>=9.0.3,<10.0.0)"
]
